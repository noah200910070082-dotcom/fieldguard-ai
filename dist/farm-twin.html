<title>智慧农田 — 3D数字孪生监控</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  .top{position:absolute;top:16px;left:50%;transform:translateX(-50%);
    background:linear-gradient(135deg,rgba(8,20,30,.92),rgba(6,28,18,.92));
    color:#00e676;padding:10px 38px;border-radius:30px;font-size:16px;font-weight:700;
    letter-spacing:5px;border:1px solid rgba(0,230,118,.22);backdrop-filter:blur(12px);
    z-index:20;pointer-events:none}
  .card{position:absolute;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:14px;padding:16px 20px;color:#d8f0d8;font-size:13px;z-index:20;min-width:160px;
    background:linear-gradient(135deg,rgba(6,18,32,.84),rgba(4,24,14,.84));
    border:1px solid rgba(0,200,100,.15);transition:border-color .5s,box-shadow .5s}
  .card .lb{color:rgba(0,210,100,.5);font-size:10px;letter-spacing:1.5px;margin-bottom:3px}
  .card .val{font-size:28px;font-weight:600;line-height:1.05;color:#00e676}
  .card .val .u{font-size:11px;color:rgba(0,210,100,.35);margin-left:1px}
  .card.warn{border-color:rgba(255,150,0,.4);box-shadow:0 0 18px rgba(255,150,0,.08)}
  .card.warn .val{color:#ff9800}
  .card.danger{border-color:rgba(255,50,50,.5);box-shadow:0 0 22px rgba(255,50,50,.12)}
  .card.danger .val{color:#ff3535}
  .c-t{top:16px;left:16px} .c-h{top:16px;right:16px}
  .c-r{bottom:16px;left:16px} .c-d{bottom:16px;right:16px}
  .legend{position:absolute;top:80px;left:16px;z-index:20;pointer-events:none}
  .legend .it{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:10px;color:rgba(255,255,255,.5)}
  .legend .dot{width:7px;height:7px;border-radius:50%}
  .hint{position:absolute;bottom:85px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.14);
    font-size:10px;z-index:20;pointer-events:none}
</style>
</head>
<body>
<div id="c"></div><div id="vignette"></div>
<div class="top">🌾 智慧农田数字孪生监控平台</div>
<div class="card c-t"><div class="lb">🌡 环境温度</div><div class="val" id="vT">--<span class="u">°C</span></div></div>

<div class="legend">
  <div class="it"><div class="dot" style="background:#4caf50"></div>安全区域</div>
  <div class="it"><div class="dot" style="background:#ff9800"></div>中风险区域</div>
  <div class="it"><div class="dot" style="background:#f44336"></div>高风险区域</div>
</div>

<script type="module">

function genTex(size,hue,sat,light,extra){const cv=document.createElement('canvas');cv.width=cv.height=size;const ctx=cv.getContext('2d');for(let y=0;y<size;y++){for(let x=0;x<size;x++){ctx.fillStyle=`hsl(${hue+R(-4,4)}%,${(sat+R(-8,8))*100}%,${(light+R(-5,5))*100}%)`;ctx.fillRect(x,y,1,1)}}if(extra){extra(ctx,size)}const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;tex.wrapS=tex.wrapT=THREE.RepeatWrapping;return tex}

const farmG=new THREE.PlaneGeometry(52,40);const farm=new THREE.Mesh(farmG,new THREE.MeshStandardMaterial({color:0x587040,roughness:.88}));farm.rotation.x=-Math.PI/2;farm.position.y=-.04;farm.receiveShadow=true;scene.add(farm);
const fields=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)fields.push({x:-12+c*12,z:-9.5+r*9.5,w:10.5,d:8});
fields.forEach(f=>{const fg=new THREE.PlaneGeometry(f.w,f.d);const fm=new THREE.Mesh(fg,new THREE.MeshStandardMaterial({map:soilTex,roughness:.82}));fm.rotation.x=-Math.PI/2;fm.position.set(f.x,.006,f.z);fm.receiveShadow=true;scene.add(fm)});
const ridgeGeoH=new THREE.BoxGeometry(50,.18,.45);const ridgeGeoV=new THREE.BoxGeometry(.45,.18,34);const ridgeMat=new THREE.MeshStandardMaterial({color:0xbfa880,roughness:.52});

for(let c=0;c<4;c++){const rd=new THREE.Mesh(ridgeGeoV,ridgeMat);rd.position.set(-18+c*12,.09,0);rd.castShadow=rd.receiveShadow=true;scene.add(rd)}
for(let i=0;i<2;i++){const pg=new THREE.PlaneGeometry(.85,31);const pm=new THREE.Mesh(pg,new THREE.MeshStandardMaterial({map:pathTex,roughness:.92}));pm.rotation.x=-Math.PI/2;pm.position.set(-7.8+i*15.6,.012,0);scene.add(pm)}
const waterGeoH=new THREE.BoxGeometry(25,.06,.32);const waterGeoV=new THREE.BoxGeometry(.32,.06,25);const waterMat=new THREE.MeshStandardMaterial({color:0x4488cc,roughness:.06,metalness:.7});
for(let i=0;i<2;i++){const w=new THREE.Mesh(waterGeoH,waterMat);w.position.set(0,.074,-8+i*16);scene.add(w)}
for(let i=0;i<2;i++){const w=new THREE.Mesh(waterGeoV,waterMat);w.position.set(-8+i*16,.074,0);scene.add(w)}
function mkCrop(type,h){const g=new THREE.Group();if(type==='corn'){const stemH=h*.5;const s=new THREE.Mesh(new THREE.CylinderGeometry(.035,.065,stemH,7),new THREE.MeshStandardMaterial({color:0x3d6d28,roughness:.5}));s.position.y=stemH/2;s.castShadow=true;g.add(s);for(let i=0;i<Math.floor(R(4,7));i++){const ly=.15+i*(h*.42/Math.floor(R(4,7)));const ang=(i%2===0?0:Math.PI/2)+R(-.45,.45);const ll=h*R(.5,.85),lw=h*.06;const l=new THREE.Mesh(new THREE.PlaneGeometry(ll,lw),new THREE.MeshStandardMaterial({color:0x55a035,roughness:.4,side:THREE.DoubleSide}));l.position.y=ly;l.rotation.set(R(.2,.7),ang,R(-.25,.25));l.position.x+=Math.cos(ang)*ll*.2;l.position.z+=Math.sin(ang)*ll*.2;l.castShadow=true;g.add(l)}const th=h*.16;const t=new THREE.Mesh(new THREE.CylinderGeometry(.018,.05,th,6),new THREE.MeshStandardMaterial({color:0xc8b050,roughness:.35}));t.position.y=stemH+th/2;t.castShadow=true;g.add(t);for(let j=0;j<3;j++){const wk=new THREE.Mesh(new THREE.CylinderGeometry(.006,.006,h*.35,4),new THREE.MeshStandardMaterial({color:0xd4c080,roughness:.25}));wk.position.y=stemH+th;wk.rotation.set(R(.25,.65),R(0,TAU),0);wk.castShadow=true;g.add(wk)}}else{const stemH=h*.6;const s=new THREE.Mesh(new THREE.CylinderGeometry(.025,.055,stemH,6),new THREE.MeshStandardMaterial({color:0x7a9a30,roughness:.55}));s.position.y=stemH/2;s.castShadow=true;g.add(s);const headH=h*.25;const head=new THREE.Mesh(new THREE.ConeGeometry(.06,.08,headH,6),new THREE.MeshStandardMaterial({color:0xd4b840,roughness:.35}));head.position.y=stemH+headH/2;head.castShadow=true;g.add(head)}return g}
const allCrops=[];fields.forEach((f,fi)=>{const rows=7,cols=10;const sx=f.w/cols,sz=f.d/rows;const type=fi%3===0?'corn':'wheat';for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const h=R(.65,1.55);const crop=mkCrop(type,h);crop.position.set(f.x-f.w/2+sx*c+R(-.12,.12),0,f.z-f.d/2+sz*r+R(-.12,.12));crop.rotation.y=R(0,TAU);crop.userData={fi,h};scene.add(crop);allCrops.push(crop)}});
for(let i=0;i<300;i++){const x=R(-28,28),z=R(-22,22);const inField=fields.some(f=>Math.abs(x-f.x)<f.w/2+1&&Math.abs(z-f.z)<f.d/2+1);if(!inField){const grass=new THREE.Mesh(new THREE.ConeGeometry(R(.08,.18),R(.2,.5),5),new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.22+R(-.04,.04),.6,R(.2,.35)),roughness:.5}));grass.position.set(x,0,z);grass.castShadow=true;scene.add(grass);allCrops.push(grass)}}

function mkTree(h){const g=new THREE.Group();const th=h*.42;const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.1,.22,th,8),new THREE.MeshStandardMaterial({color:0x6b4a2a,roughness:.75}));trunk.position.y=th/2;trunk.castShadow=true;g.add(trunk);for(let i=0;i<Math.floor(R(3,6));i++){const by=th*.5+R(0,th*.3);const ba=R(0,TAU);const bl=R(.4,.9);const bt=.6+R(0,.4);const br=new THREE.Mesh(new THREE.CylinderGeometry(.025,.05,bl,5),new THREE.MeshStandardMaterial({color:0x5a3a1e,roughness:.7}));br.position.y=by;br.position.x=Math.cos(ba)*bl*.4;br.position.z=Math.sin(ba)*bl*.4;br.rotation.set(Math.cos(ba)*bt,-Math.sin(ba)*bt,0);br.castShadow=true;g.add(br)}const cr=h*.5;const lvls=4;const nClus=[5,4,3,2];for(let i=0;i<lvls;i++){for(let j=0;j<nClus[i];j++){const cy=th+i*cr*.5;const ang=j/nClus[i]*TAU+R(-.35,.35);const dist=cr*(1-i*.22)*R(.2,.7);const leaf=new THREE.Mesh(new THREE.IcosahedronGeometry(cr*.4,0),new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.24+R(-.03,.03),.65,.2+i*.06),roughness:.45}));leaf.position.set(Math.cos(ang)*dist,cy+R(-.15,.15),Math.sin(ang)*dist);leaf.scale.set(R(.7,1.3),R(.55,.95),R(.7,1.3));leaf.castShadow=true;g.add(leaf)}}return g}
const trees=[[-20,17],[-20,-17],[20,17],[20,-17],[-22,8],[22,8],[-22,-8],[22,-8],[0,18],[0,-18],[-16,19],[-16,-19],[16,19],[16,-19],[-23,0],[23,0],[-10,17.5],[10,17.5],[-10,-17.5],[10,-17.5],[20,13],[-20,13],[20,-13],[-20,-13]];const treeObjs=[];trees.forEach(([x,z])=>{const t=mkTree(R(2.8,5.2));t.position.set(x,0,z);t.rotation.y=R(0,TAU);scene.add(t);treeObjs.push(t)});
function mkHouse(){const g=new THREE.Group();const wallMat=new THREE.MeshStandardMaterial({color:0xf0e6d0,roughness:.55});const roofMat=new THREE.MeshStandardMaterial({color:0x9a3a20,roughness:.5});const woodMat=new THREE.MeshStandardMaterial({color:0x5c3818,roughness:.45});const w=new THREE.Mesh(new THREE.BoxGeometry(3,1.8,2.2),wallMat);w.position.y=.9;w.castShadow=true;w.receiveShadow=true;g.add(w);const roofH=1.3,roofW=3.6,roofD=2.8;const roofShape=new THREE.Shape();roofShape.moveTo(-roofW/2,0);roofShape.lineTo(0,roofH);roofShape.lineTo(roofW/2,0);roofShape.closePath();const roofGeo=new THREE.ExtrudeGeometry(roofShape,{steps:1,depth:roofD,bevelEnabled:false});const roof=new THREE.Mesh(roofGeo,roofMat);roof.position.set(-roofW/2,1.8,-roofD/2);roof.castShadow=true;roof.receiveShadow=true;g.add(roof);const chimney=new THREE.Mesh(new THREE.BoxGeometry(.35,2.2,.35),new THREE.MeshStandardMaterial({color:0xb88960,roughness:.6}));chimney.position.set(.8,2.3,-.4);chimney.castShadow=true;g.add(chimney);const door=new THREE.Mesh(new THREE.PlaneGeometry(.55,1.1),woodMat);door.position.set(0,.5,1.11);g.add(door);for(let s=-1;s<=1;s+=2){const win=new THREE.Mesh(new THREE.PlaneGeometry(.45,.45),new THREE.MeshStandardMaterial({color:0xaaddff,roughness:.2,emissive:0x112233,emissiveIntensity:.25}));win.position.set(s*.85,1.15,1.11);g.add(win)}const porch=new THREE.Mesh(new THREE.PlaneGeometry(1.2,.8),woodMat);porch.rotation.x=-Math.PI/2;porch.position.set(0,.05,1.8);g.add(porch);for(let s=-1;s<=1;s+=2){const col=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.8,6),woodMat);col.position.set(s*.5,.4,2.1);col.castShadow=true;g.add(col)}return g}
const house=mkHouse();house.position.set(21,0,17);house.rotation.y=-.45;scene.add(house);
const pondGeo=new THREE.CircleGeometry(3,32);const pond=new THREE.Mesh(pondGeo,new THREE.MeshStandardMaterial({color:0x3377aa,roughness:.04,metalness:.8}));pond.rotation.x=-Math.PI/2;pond.position.set(21,0.02,12);scene.add(pond);
for(let i=0;i<24;i++){const ang=i/24*TAU;const r=3+R(-.3,.3);const stone=new THREE.Mesh(new THREE.IcosahedronGeometry(R(.15,.35),0),new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.12,R(.1,.25),R(.35,.55)),roughness:.6}));stone.position.set(21+Math.cos(ang)*r,.06,12+Math.sin(ang)*r);stone.rotation.set(R(0,Math.PI),R(0,Math.PI),R(0,Math.PI));stone.castShadow=true;scene.add(stone)}
const fb={mx:-18,Mx:18,mz:-15,Mz:15};const postGeo=new THREE.CylinderGeometry(.055,.075,.85,6);const postMat=new THREE.MeshStandardMaterial({color:0xb89868,roughness:.55});const postPositions=[];for(let x=fb.mx;x<=fb.Mx+.01;x+=1.1){postPositions.push({x,z:fb.mz});postPositions.push({x,z:fb.Mz})}for(let z=fb.mz+1.1;z<=fb.Mz-.01;z+=1.1){postPositions.push({x:fb.mx,z});postPositions.push({x:fb.Mx,z})}postPositions.forEach(({x,z})=>{const p=new THREE.Mesh(postGeo,postMat);p.position.set(x,.4,z);p.castShadow=true;p.receiveShadow=true;scene.add(p)});
function mkScarecrow(){const g=new THREE.Group();const pole=new THREE.Mesh(new THREE.CylinderGeometry(.04,.05,2.4,6),new THREE.MeshStandardMaterial({color:0x8a6a40,roughness:.6}));pole.position.y=1.2;g.add(pole);const cross=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,1.2,6),new THREE.MeshStandardMaterial({color:0x8a6a40,roughness:.6}));cross.rotation.z=Math.PI/2;cross.position.set(0,1.9,.1);g.add(cross);const head=new THREE.Mesh(new THREE.SphereGeometry(.18,8,6),new THREE.MeshStandardMaterial({color:0xf5e6d0,roughness:.5}));head.position.y=2.25;g.add(head);const hatBrim=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.04,12),new THREE.MeshStandardMaterial({color:0x5a3a1a,roughness:.5}));hatBrim.position.y=2.4;g.add(hatBrim);const hatTop=new THREE.Mesh(new THREE.CylinderGeometry(.14,.18,.22,12),new THREE.MeshStandardMaterial({color:0x5a3a1a,roughness:.5}));hatTop.position.y=2.53;g.add(hatTop);return g}
const scarecrow=mkScarecrow();scarecrow.position.set(-10,0,-14);scene.add(scarecrow);
function mkTractor(){const g=new THREE.Group();const redMat=new THREE.MeshStandardMaterial({color:0xcc3333,roughness:.3,metalness:.4});const darkMat=new THREE.MeshStandardMaterial({color:0x222222,roughness:.4,metalness:.5});const body=new THREE.Mesh(new THREE.BoxGeometry(.8,.5,1.3),redMat);body.position.y=.55;body.castShadow=true;g.add(body);const cab=new THREE.Mesh(new THREE.BoxGeometry(.75,.7,.8),new THREE.MeshStandardMaterial({color:0x334455,roughness:.2,metalness:.3}));cab.position.set(0,1.15,-.15);cab.castShadow=true;g.add(cab);const roof=new THREE.Mesh(new THREE.BoxGeometry(.9,.06,.9),darkMat);roof.position.set(0,1.52,-.15);roof.castShadow=true;g.add(roof);for(let s=-1;s<=1;s+=2){const rw=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.25,16),darkMat);rw.rotation.z=Math.PI/2;rw.position.set(s*.5,.35,.55);rw.castShadow=true;g.add(rw);const rw2=rw.clone();rw2.position.z=-.55;rw2.castShadow=true;g.add(rw2)}return g}
const tractor=mkTractor();tractor.position.set(22,0,20.5);tractor.rotation.y=-.8;scene.add(tractor);
function mkMecanumWheel(radius,width,segments){const g=new THREE.Group();const hubMat=new THREE.MeshStandardMaterial({color:0x222222,roughness:.3,metalness:.6});const rollerMat=new THREE.MeshStandardMaterial({color:0xeeeeee,roughness:.4,metalness:.3});const hub=new THREE.Mesh(new THREE.CylinderGeometry(radius*.85,radius*.85,width*.7,segments),hubMat);hub.rotation.z=Math.PI/2;hub.castShadow=true;g.add(hub);const rollerCount=8;for(let i=0;i<rollerCount;i++){const ang=i/rollerCount*TAU;const rr=new THREE.Mesh(new THREE.CylinderGeometry(radius*.15,radius*.15,width*1.15,6),rollerMat);rr.rotation.z=Math.PI/4;rr.rotation.y=ang;rr.position.set(Math.cos(ang)*radius*.7,0,Math.sin(ang)*radius*.7);rr.castShadow=true;g.add(rr)}return g}
function mkGimbal(){const g=new THREE.Group();const alumMat=new THREE.MeshStandardMaterial({color:0x888888,roughness:.25,metalness:.8});const lensMat=new THREE.MeshStandardMaterial({color:0x111111,roughness:.1,metalness:.3});const base=new THREE.Mesh(new THREE.CylinderGeometry(.15,.18,.12,12),alumMat);base.position.y=.06;g.add(base);const bracketL=new THREE.Mesh(new THREE.BoxGeometry(.04,.15,.1),alumMat);bracketL.position.set(-.1,.18,0);g.add(bracketL);const bracketR=bracketL.clone();bracketR.position.x=.1;g.add(bracketR);const axle=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.22,8),alumMat);axle.rotation.x=Math.PI/2;axle.position.y=.21;g.add(axle);const camBody=new THREE.Mesh(new THREE.BoxGeometry(.12,.06,.15),lensMat);camBody.position.y=.25;g.add(camBody);const lens=new THREE.Mesh(new THREE.CylinderGeometry(.04,.045,.1,12),alumMat);lens.rotation.x=Math.PI/2;lens.position.set(0,.25,.1);g.add(lens);const lensGlass=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.02,12),new THREE.MeshStandardMaterial({color:0x334466,roughness:.05,metalness:.1}));lensGlass.rotation.x=Math.PI/2;lensGlass.position.set(0,.25,.16);g.add(lensGlass);return g}
function mkArm(){const g=new THREE.Group();const motorMat=new THREE.MeshStandardMaterial({color:0x666666,roughness:.2,metalness:.8});const linkMat=new THREE.MeshStandardMaterial({color:0x444444,roughness:.3,metalness:.7});const base=new THREE.Mesh(new THREE.CylinderGeometry(.12,.14,.1,12),motorMat);base.position.y=.06;g.add(base);const joint1=new THREE.Mesh(new THREE.BoxGeometry(.14,.1,.1),motorMat);joint1.position.y=.15;g.add(joint1);const arm1=new THREE.Mesh(new THREE.BoxGeometry(.06,.4,.06),linkMat);arm1.position.set(0,.4,0);arm1.castShadow=true;g.add(arm1);const joint2=new THREE.Mesh(new THREE.BoxGeometry(.1,.08,.1),motorMat);joint2.position.y=.6;g.add(joint2);const arm2=new THREE.Mesh(new THREE.BoxGeometry(.04,.3,.04),linkMat);arm2.position.set(0,.8,0);arm2.castShadow=true;g.add(arm2);const end=new THREE.Mesh(new THREE.BoxGeometry(.08,.06,.08),new THREE.MeshStandardMaterial({color:0x00a850,roughness:.2,metalness:.4,emissive:0x002010,emissiveIntensity:.2}));end.position.y=.96;g.add(end);const ecam=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.06,8),motorMat);ecam.rotation.x=Math.PI/2;ecam.position.set(0,.96,.06);g.add(ecam);return g}
function mkRobot(){const g=new THREE.Group();const bm=new THREE.MeshStandardMaterial({color:0x344050,roughness:.2,metalness:.75});const am=new THREE.MeshStandardMaterial({color:0x00b848,roughness:.16,metalness:.5,emissive:0x003818,emissiveIntensity:.2});const plateMat=new THREE.MeshStandardMaterial({color:0x2a3540,roughness:.3,metalness:.6});const bottomPlate=new THREE.Mesh(new THREE.BoxGeometry(.6,.06,.9),plateMat);bottomPlate.position.y=.09;bottomPlate.castShadow=true;g.add(bottomPlate);const chipMat=new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:.3});for(let i=0;i<4;i++){const chip=new THREE.Mesh(new THREE.BoxGeometry(.1,.04,.15),chipMat);chip.position.set(R(-.2,.2),.14,R(-.3,.3));g.add(chip)}const standoffsL=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.15,6),am);standoffsL.position.set(-.2,.18,-.3);g.add(standoffsL);const standoffsR=standoffsL.clone();standoffsR.position.x=.2;g.add(standoffsR);const standoffsB=standoffsL.clone();standoffsB.position.z=.3;g.add(standoffsB);const standoffsB2=standoffsL.clone();standoffsB2.position.set(-.2,.18,.3);g.add(standoffsB2);const topPlate=new THREE.Mesh(new THREE.BoxGeometry(.6,.08,.9),bm);topPlate.position.y=.26;topPlate.castShadow=true;g.add(topPlate);const mcu=new THREE.Mesh(new THREE.BoxGeometry(.35,.04,.45),new THREE.MeshStandardMaterial({color:0x004488,roughness:.2,metalness:.4}));mcu.position.y=.32;g.add(mcu);const wheelR=.2,wheelW=.1;const wheelPositions=[{x:.32,y:.2,z:.4},{x:-.32,y:.2,z:.4},{x:.32,y:.2,z:-.4},{x:-.32,y:.2,z:-.4}];const wheels=[];wheelPositions.forEach(({x,y,z})=>{const wh=mkMecanumWheel(wheelR,wheelW,12);wh.position.set(x,.1,z);wh.rotation.z=Math.PI/2;wh.rotation.y=Math.PI/2;wh.userData.isWheel=true;g.add(wh);wheels.push(wh)});const gimbal1=mkGimbal();gimbal1.position.set(0,.38,.42);g.add(gimbal1);g.userData.gimbal1=gimbal1;const gimbal2=mkGimbal();gimbal2.position.set(0,.38,-.42);gimbal2.rotation.y=Math.PI;g.add(gimbal2);g.userData.gimbal2=gimbal2;const arm=mkArm();arm.position.set(.28,.26,.2);arm.rotation.y=-.3;g.add(arm);g.userData.arm=arm;for(let s=-1;s<=1;s+=2){for(let t=-1;t<=1;t+=2){const usGeo=new THREE.CylinderGeometry(.03,.03,.08,6);const us=new THREE.Mesh(usGeo,new THREE.MeshStandardMaterial({color:0xcccccc,roughness:.15,metalness:.7}));us.position.set(s*.22,.3,t*.38);if(t===1)us.rotation.set(0,0,Math.PI/2);if(t===-1)us.rotation.set(0,0,-Math.PI/2);if(Math.abs(s)===1&&Math.abs(t)===1)us.rotation.set(Math.PI/2,0,0);g.add(us)}}const ledGeo=new THREE.SphereGeometry(.04,6);const ledMat=new THREE.MeshStandardMaterial({color:0x00ff00,emissive:0x00ff00,emissiveIntensity:.8,roughness:.1});const led1=new THREE.Mesh(ledGeo,ledMat);led1.position.set(0,.42,.25);g.add(led1);const led2=led1.clone();led2.position.set(0,.42,-.25);g.add(led2);const antPole=new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,.35,8),am);antPole.position.set(.1,.5,-.15);g.add(antPole);const antBall=new THREE.Mesh(new THREE.SphereGeometry(.06,8),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.08}));antBall.position.set(.1,.7,-.15);g.add(antBall);return g}
const wp=[{x:-11.8,z:-9},{x:-11.8,z:9},{x:0,z:9},{x:0,z:-9},{x:11.8,z:-9},{x:11.8,z:9},{x:-11.8,z:9}];
const robot=mkRobot();robot.position.set(wp[0].x,0,wp[0].z);robot.rotation.y=0;robot.castShadow=true;robot.scale.set(.55,.55,.55);scene.add(robot);
let rIdx=0,rProg=0,rSpeed=.28;
for(let i=-2;i<=2;i++){const h=new THREE.Mesh(new THREE.ConeGeometry(22,7,14,1),new THREE.MeshStandardMaterial({color:0x5c7048,roughness:.88}));h.position.set(i*20,2.5,-58);h.scale.set(1.2,1,.7);const h2=h.clone();h2.position.set(i*22+10,2,9);h2.position.z=58;scene.add(h2);scene.add(h)}
const btCount=30;const btGeo=new THREE.BufferGeometry();const btPos=new Float32Array(btCount*3);const btData=[];for(let i=0;i<btCount;i++){btPos[i*3]=R(-25,25);btPos[i*3+1]=R(1,6);btPos[i*3+2]=R(-25,25);btData.push({vx:R(-.5,.5),vy:R(-.3,.8),vz:R(-.5,.5),t:R(0,TAU),s:R(.8,1.2)})}btGeo.setAttribute('position',new THREE.BufferAttribute(btPos,3));const bt=new THREE.Points(btGeo,new THREE.PointsMaterial({color:0xffdd88,size:.08,transparent:true,opacity:.7,depthWrite:false}));scene.add(bt);
let time=0;
function updateUI(){const temp=(27+Math.sin(time*.22)*4.5+R(-.3,.3)).toFixed(1);const hum=Math.floor(56+Math.cos(time*.28)*15+R(-2,2));const riskR=.35+Math.sin(time*.16)*.35+(parseFloat(temp)-28)*.04+(hum-65)*.007;const risk=Math.max(.02,Math.min(.98,riskR)).toFixed(2);const rN=parseFloat(risk);vT.innerHTML=`${temp}<span class="u">°C</span>`;vH.innerHTML=`${hum}<span class="u">%</span>`;vR.innerHTML=`${risk}<span class="u">/1.00</span>`;const cr=cardR;cr.classList.remove('warn','danger');if(rN>=.75){cr.classList.add('danger');vD.textContent='⚠ 触发喷洒'}else if(rN>=.5){cr.classList.add('warn');vD.textContent='🔍 重点监测'}else{vD.textContent='✅ 正常巡检'}}
const {vT,vH,vR,vD,cardR}=(()=>{const gid=s=>document.getElementById(s);return{vT:gid('vT'),vH:gid('vH'),vR:gid('vR'),vD:gid('vD'),cardR:gid('cardR')}})();
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.12);time+=dt;ctrl.update();allCrops.forEach((c,i)=>{const s=Math.sin(time*2.1+i*.06+c.position.x*.28)*.018;c.rotation.z=s;c.rotation.x=Math.cos(time*1.8+i*.08+c.position.z*.28)*.01});const from=wp[rIdx],to=wp[(rIdx+1)%wp.length];const dist=Math.sqrt((to.x-from.x)**2+(to.z-from.z)**2);const duration=dist/(rSpeed+.001);rProg+=dt/duration;if(rProg>=1){rProg=0;rIdx=(rIdx+1)%wp.length;if(dist<4)rSpeed=.15;else rSpeed=.32}const t2=rProg<.5?2*rProg*rProg:1-Math.pow(-2*rProg+2,2)/2;robot.position.x=from.x+(to.x-from.x)*t2;robot.position.z=from.z+(to.z-from.z)*t2;robot.rotation.y=Math.atan2(to.x-from.x,to.z-from.z)+Math.sin(time*3)*.04;robot.position.y=Math.sin(time*4.5)*.02;robot.children.forEach(ch=>{if(ch.userData&&ch.userData.isWheel){ch.children.forEach(sub=>{sub.rotation.y+=dt*3})}});if(robot.userData.gimbal1){robot.userData.gimbal1.rotation.y=Math.sin(time*1.5)*.6;robot.userData.gimbal1.children.forEach(c=>{if(c.type==='Mesh'&&c.material.color&&c.material.color.getHex()===0x334466)c.rotation.y=Math.sin(time*2)*.3})}if(robot.userData.gimbal2){robot.userData.gimbal2.rotation.y=Math.PI+Math.sin(time*1.5+.8)*.6}if(robot.userData.arm){robot.userData.arm.rotation.y=-.3+Math.sin(time*.8)*.15}waterMat.emissive=new THREE.Color().setHSL(.56,.45,.07+Math.sin(time*2.5)*.015);waterMat.emissiveIntensity=.25+Math.sin(time*3)*.1;const btp=bt.geometry.attributes.position;for(let i=0;i<btCount;i++){const d=btData[i];let px=btp.getX(i),py=btp.getY(i),pz=btp.getZ(i);px+=d.vx*dt+Math.sin(d.t+time)*.05;py+=d.vy*dt+Math.cos(d.t+time*.7)*.03;pz+=d.vz*dt+Math.cos(d.t+time*.8)*.05;if(py<.1||py>8){d.vy*=-1;py=Math.max(.1,Math.min(8,py))}if(Math.abs(px)>28){d.vx*=-1}if(Math.abs(pz)>28){d.vz*=-1}btp.setXYZ(i,px,py,pz);d.t+=dt}bt.geometry.attributes.position.needsUpdate=true;treeObjs.forEach((t,i)=>{t.rotation.z=Math.sin(time*1.5+i*.3)*.01;t.rotation.x=Math.cos(time*1.3+i*.2)*.008});if(Math.floor(time)!==Math.floor(time-dt))updateUI();sky.material.uniforms.uTime.value=time;rend.render(scene,cam)}
updateUI();animate();
addEventListener('resize',()=>{cam.aspect=window.innerWidth/window.innerHeight;cam.updateProjectionMatrix();rend.setSize(window.innerWidth,window.innerHeight)});
